  <!-- Building silhouette + cornice -->
  <rect x="6" y="3.4" width="20" height="2.4" rx="0.6" fill="#141414"/>
  <rect x="8" y="5.4" width="16" height="23.2" fill="#141414"/>
  <!-- Windows (white punch-outs), two lit in brand yellow -->
  <rect x="10.4" y="7.6"  width="4" height="4.4" rx="0.5" fill="#FFFFFF"/>
  <rect x="17.6" y="7.6"  width="4" height="4.4" rx="0.5" fill="#F2ED5F"/>
  <rect x="10.4" y="13.6" width="4" height="4.4" rx="0.5" fill="#F2ED5F"/>
  <rect x="17.6" y="13.6" width="4" height="4.4" rx="0.5" fill="#FFFFFF"/>
  <rect x="10.4" y="19.6" width="4" height="4.4" rx="0.5" fill="#FFFFFF"/>
  <rect x="17.6" y="19.6" width="4" height="4.4" rx="0.5" fill="#FFFFFF"/>
  <!-- Door -->
  <rect x="13.4" y="24.4" width="5.2" height="4.2" rx="0.5" fill="#FFFFFF"/>
</svg>
